<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="We will test image rendering in different devices: desktop/laptop, tablet, smartphone.">
    <title>Responsive Images</title>
    <meta name="author" content="Víctor Hugo Neumann">
    <title>The House of the Lord</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link href="styles/responsive-images.css" rel="stylesheet">
</head>

<body>
    <main>
        <div class="hero">
            <picture>
                <source media="(min-width: 1000px)" srcset="images/hero-large.webp">
                <source media="(min-width: 500px)" srcset="images/hero-medium.webp">
                <img src="images/hero-small.webp" alt="Salta Argentina Temple at dawn" width="500" height="250">
            </picture>
        </div>
    </main>
</body>

</html>
