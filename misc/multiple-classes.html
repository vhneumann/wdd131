<!doctype html>
<html lang="en">
<head>

  <meta name="description" content="Here we use more tahn one property in a class">
  <meta name="author" content="Victor H. Neumann">
  <link rel="stylesheet" href="styles/multiple-classes.css">

</head>

<body>

<header>
  <div class="centered red1">
    <p>This is contained within the HEADER area.</p>
  </div>
</header>

<main>
  <div class="right-aligned blue1">

  </div>
</main>

  </div>
</footer>
