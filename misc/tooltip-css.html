<!DOCTYPE html>
<html lang="en">
<head>
  <style>
  [interestfor] {
    interest-delay: 0.2s;
  }

  #trigger {
    anchor-name: --trigger;
  }

  #tooltip {
    position: fixed;
    position-anchor: --trigger;
    position-area: bottom;
    translate: 0% 8px;
    position-try-fallbacks: flip-block;

    background: #1a4722;
    color: #e4e4e7;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    box-shadow: 0 4px 16px rgba(0,0,0,.2);

    /* Entry animation */
    transition: opacity 0.2s, translate 0.2s;
    transition-behavior: allow-discrete;

    @starting-style {
      opacity: 0;
      translate: -50% 16px;
    }
  }
  </style>


</head>

<body>
  <h1>
    Build a tooltip system with popover hint and
    anchor positioning
  </h1>

  <button id="trigger"
  interestfor="tooltip">
    Hover me
  </button>
  <div id="tooltip" popover=hint>
    Now you see it!
  </div>

</body>

</html>
