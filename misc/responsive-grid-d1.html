<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive grid - Desktop-first</title>
    <style>
        /* Here comes the desktop version */
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: max(2vw, 3vh)
        }

        .grid1 {
            max-width: 800px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            padding: 1.5rem;
            justify-content: center;
            align-content: center;
        }

        .item {
            background: teal;
            color: white;
            /* margin: 0 auto; */
            /* width: 100%; */
            padding: 1.5rem;
            text-align: center;
        }

        /* Now comes the Mobile section */
        @media (max-width:600px) {
            .grid1 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="grid1">
        <div class="item">
            <p>one</p>
        </div>
        <div class="item">
            <p>two</p>
        </div>
        <div class="item">
            <p>three</p>
        </div>
        <div class="item">
            <p>four</p>
        </div>
        <div class="item">
            <p>five</p>
        </div>
        <div class="item">
            <p>six</p>
        </div>
        <div class="item">
            <p>seven</p>
        </div>
        <div class="item">
            <p>eight</p>
        </div>
        <div class="item">
            <p>nine</p>
        </div>
        <div class="item">
            <p>ten</p>
        </div>

    </div>
</body>

</html>
